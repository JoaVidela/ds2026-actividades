services:
  api:
    build: ./backend
    ports:
      - "3000:3000"
    env_file:
      - backend/.env
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./backend/src:/app/src
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    env_file:
      - backend/.env
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
